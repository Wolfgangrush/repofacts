[project]
name = "repofacts"
version = "0.1.0"
description = "Verify the GitHub repos an AI recommended: real, licensed, alive, runnable."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
repofacts = "repofacts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 121

[tool.ruff.lint]
# Ruff's default rule set, stated explicitly so a ruff upgrade cannot silently
# widen or narrow what CI enforces.
select = ["E4", "E7", "E9", "F"]
